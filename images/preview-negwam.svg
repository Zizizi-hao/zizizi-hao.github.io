<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="title desc">
  <title id="title">NegWAM — learning from negative trajectories</title>
  <desc id="desc">Conceptual illustration of an ego vehicle approaching an intersection. A green trajectory turns away from a coral negative trajectory that approaches another vehicle. This illustration does not depict an experimental result.</desc>
