    <marker id="arrow-green" markerWidth="9" markerHeight="9" refX="5" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 8 4 0 8" fill="none" stroke="#237b6c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
    <pattern id="crosswalk" width="19" height="12" patternUnits="userSpaceOnUse"><rect width="10" height="12" fill="#fbfbf7"/></pattern>
  </defs>
  <rect width="960" height="600" fill="#f1f2ed"/>
